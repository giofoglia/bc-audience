<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Breaking Clouds Audience</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="BC Audience">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
:root{
  --bg:#FAF6EE; --surface:#FFFDF8; --glass:rgb(255 255 255 / .62); --sunk:#F3EAD8; --cloud:#ECE1CB;
  --ink:#2B241A; --muted:#7A7062; --line:rgb(122 101 63 / .18);
  --sun:#F0AA40; --copper:#A8700E; --sun-soft:rgb(240 170 64 / .2); --warn:#A8560E;
  --shadow:0 18px 50px -12px rgb(148 118 62 / .28);
  --ui:"Figtree",-apple-system,system-ui,"Segoe UI",sans-serif; --serif:"Newsreader",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1B1711; --surface:#241F17; --glass:rgb(43 36 26 / .72); --sunk:#2E271D; --cloud:#3A3226;
  --ink:#FAF6EE; --muted:#B5A991; --line:rgb(236 225 203 / .14);
  --sun:#F0AA40; --copper:#F0C27A; --sun-soft:rgb(240 170 64 / .18); --warn:#F0C27A;
  --shadow:0 18px 50px -12px rgb(0 0 0 / .5); color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui);min-height:100vh;
  background-image:radial-gradient(60% 40% at 15% 0%,var(--cloud),transparent 70%),radial-gradient(50% 35% at 90% 8%,var(--sunk),transparent 70%),radial-gradient(40% 30% at 50% 0%,var(--sun-soft),transparent 70%);
  background-repeat:no-repeat;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.dash{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-block:max(20px,env(safe-area-inset-top,0px)) max(32px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.head{display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:48px;height:auto;display:block;flex:none}
h1{font:500 30px/1.1 var(--serif);letter-spacing:-.01em;margin:0}
.brands{display:flex;gap:10px;margin-left:auto}
.brands a{display:block;line-height:0}
.picon{width:38px;height:38px;display:block;border-radius:9px;box-shadow:0 2px 8px rgb(43 36 26 / .22)}
.narr{margin:0;color:var(--muted);line-height:1.55;max-width:78ch}
.narr b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:inline-flex;gap:2px;background:var(--sunk);border-radius:999px;padding:3px}
.chips button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgb(43 36 26 / .15)}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--copper)}
.live.old i{background:transparent;box-shadow:inset 0 0 0 2px var(--warn)}
.live.old{color:var(--warn);font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:14px}
.big{grid-row:span 3;display:flex;flex-direction:column;gap:12px}
.small{display:flex;flex-direction:column;gap:4px;padding:14px 16px}
.who{display:flex;align-items:center;gap:10px;margin-bottom:6px;min-width:0}
.who .picon{width:44px;height:44px;border-radius:11px;flex:none}
.who a{font-size:15px;font-weight:600;color:inherit;text-decoration:none}
.who a:hover{text-decoration:underline}
.lab{font-size:13px;color:var(--muted)}
.num{font:500 32px/1.1 var(--serif);font-variant-numeric:lining-nums tabular-nums}
.big .num{font-size:46px}
.unit{font:400 13px var(--ui);color:var(--muted);margin-left:6px}
.chg{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chg b{color:var(--ink);font-weight:600}
.stale{font-size:13px;color:var(--warn);font-weight:600}
.subs{display:flex;gap:24px;flex-wrap:wrap}
.subs b{display:block;font:500 17px/1.2 var(--serif);font-variant-numeric:lining-nums tabular-nums}
.subs span{font-size:12px;color:var(--muted)}
.plot{position:relative;touch-action:pan-y;margin-top:auto}
.plot svg{display:block;width:100%;height:auto;overflow:visible}
.plot.axis{padding-left:34px}
.ylab{position:absolute;left:0;transform:translateY(-50%);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.xlabs{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);padding-left:34px;font-variant-numeric:tabular-nums}
.tip{position:absolute;top:-6px;transform:translate(-50%,-100%);background:var(--ink);color:var(--bg);border-radius:8px;padding:4px 9px;font-size:13px;white-space:nowrap;pointer-events:none;z-index:3}
.note{font-size:12px;color:var(--muted);margin:0}
@media (max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.big{grid-column:1/-1;grid-row:auto}}
@media (max-width:760px){
  body{font-size:16.5px;line-height:1.6}
  .card{padding:16px}.small{padding:13px 14px}
  h1{font-size:25px}.logo{width:42px}
  .brands{margin-left:0;width:100%}.picon{width:36px;height:36px}.who .picon{width:40px;height:40px}
  .narr{font-size:16px;line-height:1.6}
  .chips{width:100%}.chips button{flex:1;font-size:13.5px;min-height:38px;padding:5px 4px}
  .meta,.lab,.chg,.stale,.note,.subs span,.xlabs,.ylab,.unit,.tip{font-size:13.5px}
  .num{font-size:30px}.big .num{font-size:42px}
}
</style>
</head>
<body>
<main class="dash" id="dash"><div class="card"><p class="narr">Loading the latest numbers…</p></div></main>
<script>
const ICONS={
  instagram:'<svg class="picon" viewBox="0 0 24 24" aria-hidden="true"><defs><radialGradient id="igGrad" cx="30%" cy="107%" r="150%"><stop offset="0" stop-color="#FDF497"/><stop offset=".08" stop-color="#FDF497"/><stop offset=".45" stop-color="#FD5949"/><stop offset=".6" stop-color="#D6249F"/><stop offset=".9" stop-color="#285AEB"/></radialGradient></defs><rect width="24" height="24" rx="5.5" fill="url(#igGrad)"/><rect x="5" y="5" width="14" height="14" rx="4.2" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="3.4" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="16.3" cy="7.7" r="1.05" fill="#fff"/></svg>',
  linkedin:'<svg class="picon" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5.5" fill="#0A66C2"/><g fill="#fff"><rect x="5" y="9.6" width="3" height="9.4"/><circle cx="6.5" cy="6.4" r="1.8"/><path d="M10.2 9.6H13v1.3c.5-.9 1.6-1.6 3-1.6 2.5 0 3.5 1.6 3.5 4.1V19h-3v-5c0-1.2-.4-2.1-1.5-2.1-1.2 0-1.8.9-1.8 2.1v5h-3z"/></g></svg>',
  youtube:'<svg class="picon" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5.5" fill="#FF0000"/><path d="M9.6 7.6v8.8l7.4-4.4z" fill="#fff"/></svg>',
  tiktok:'<svg class="picon" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5.5" fill="#010101"/><g transform="translate(-.7 -.1)"><path d="M14.1 3h2.7c.2 1.8 1.3 3.2 3.2 3.5v2.7c-1.2 0-2.3-.4-3.2-1v6.5a5.6 5.6 0 1 1-5.6-5.6l.8.1v2.8a2.8 2.8 0 1 0 2.1 2.7z" fill="#25F4EE"/></g><g transform="translate(.7 .5)"><path d="M14.1 3h2.7c.2 1.8 1.3 3.2 3.2 3.5v2.7c-1.2 0-2.3-.4-3.2-1v6.5a5.6 5.6 0 1 1-5.6-5.6l.8.1v2.8a2.8 2.8 0 1 0 2.1 2.7z" fill="#FE2C55"/></g><g transform="translate(0 .2)"><path d="M14.1 3h2.7c.2 1.8 1.3 3.2 3.2 3.5v2.7c-1.2 0-2.3-.4-3.2-1v6.5a5.6 5.6 0 1 1-5.6-5.6l.8.1v2.8a2.8 2.8 0 1 0 2.1 2.7z" fill="#fff"/></g></svg>',
  substack:'<svg class="picon" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5.5" fill="#FF6719"/><g transform="translate(5.2 4.6) scale(.567)" fill="#fff"><path d="M22.54 8.24H1.46V5.41h21.08zM1.46 10.81V24L12 18.11 22.54 24V10.81zM22.54 0H1.46v2.84h21.08z"/></g></svg>'
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const RANGES=[[7,"7 days"],[28,"28 days"],[84,"12 weeks"],[0,"All"]];
const STALE_HOURS=3;
let D=null,range=28;
const dayNum=s=>Date.parse(s+"T00:00:00Z");
const dayStr=t=>new Date(t).toISOString().slice(0,10);
const fmtDay=(s,y)=>new Date(dayNum(s)).toLocaleDateString("en-GB",Object.assign({day:"numeric",month:"short",timeZone:"UTC"},y?{year:"numeric"}:{}));
const fmtN=n=>Number(n).toLocaleString("en-GB");
const signed=n=>(n>0?"+":n<0?"−":"±")+fmtN(Math.abs(n));
const atOrBefore=(pts,d)=>{let r=null;for(const p of pts){if(p.date<=d)r=p;else break}return r};
function ago(iso){
  const m=Math.round((Date.now()-Date.parse(iso))/6e4);
  if(!isFinite(m))return "never";
  if(m<2)return "just now";if(m<60)return m+" minutes ago";
  const h=Math.round(m/60);if(h<36)return h+(h===1?" hour ago":" hours ago");
  const d=Math.round(h/24);return d+" days ago";
}
const isOld=iso=>!iso||Date.now()-Date.parse(iso)>STALE_HOURS*36e5;
function spark(pts,win,metric){
  const inR=pts.filter(p=>p.date>=win.start&&p.date<=win.end),base=atOrBefore(pts,win.start);
  const use=base&&(!inR.length||inR[0].date!==base.date)?[base,...inR]:inR;
  if(!use.length)return "";
  const t0=dayNum(win.start),t1=Math.max(dayNum(win.end),t0+1);
  const ns=use.map(p=>p.n),lo=Math.min(...ns),hi=Math.max(...ns);
  const xy=use.map(p=>({x:+(6+Math.max(0,dayNum(p.date)-t0)/(t1-t0)*288).toFixed(1),y:+(hi===lo?40:68-(p.n-lo)/(hi-lo)*56).toFixed(1),label:`${fmtDay(p.date,true)}: ${fmtN(p.n)} ${metric}`}));
  const last=xy[xy.length-1],line=xy.map((q,i)=>(i?"L":"M")+q.x+" "+q.y).join(" ");
  return `<div class="plot" data-w="300" data-pts='${esc(JSON.stringify(xy))}'><svg viewBox="0 0 300 80" role="img" aria-label="${esc(last.label)}">
    <line x1="0" x2="300" y1="76" y2="76" stroke="var(--line)"/>
    ${xy.length>1?`<path d="${line} L${last.x} 76 L${xy[0].x} 76 Z" fill="var(--sun-soft)"/><path d="${line}" fill="none" stroke="var(--copper)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:""}
    <line class="cross" y1="0" y2="76" stroke="var(--muted)" visibility="hidden"/>
    <circle cx="${last.x}" cy="${last.y}" r="6" fill="var(--copper)" stroke="var(--surface)" stroke-width="2.5"/></svg></div>`;
}
function bars(P,dates,win){
  const shown=dates.filter(d=>d>=win.start&&d<=win.end);
  const totals=shown.map(d=>{let t=0;const parts=[];for(const p of P){const c=atOrBefore(p.counts,d);if(c){t+=c.n;parts.push(p.name+" "+fmtN(c.n))}}return{d,t,parts}});
  const hi=Math.max(1,...totals.map(x=>x.t)),t0=dayNum(win.start),t1=dayNum(win.end),single=t1===t0,span=Math.max(1,(t1-t0)/864e5);
  const W=Math.max(8,Math.min(38,520/span*.7)),top=14,base=280;
  const b=totals.map(x=>{const cx=single?300:W/2+4+(dayNum(x.d)-t0)/(t1-t0)*(592-W),h=Math.max(3,x.t/hi*(base-top)),r=Math.min(4,W/2,h),l=cx-W/2,y=base-h;
    return{x:+cx.toFixed(1),label:`${fmtDay(x.d,true)}: ${fmtN(x.t)} (${x.parts.join(", ")})`,d:`M${l} ${base}V${y+r}Q${l} ${y} ${l+r} ${y}H${l+W-r}Q${l+W} ${y} ${l+W} ${y+r}V${base}Z`}});
  return `<div class="plot axis" data-w="600" data-pts='${esc(JSON.stringify(b.map(q=>({x:q.x,label:q.label}))))}'>
    <span class="ylab" style="top:${top/3}%">${fmtN(hi)}</span><span class="ylab" style="top:${base/3}%">0</span>
    <svg viewBox="0 0 600 300" role="img" aria-label="Total audience on each date"><line x1="0" x2="600" y1="${top}" y2="${top}" stroke="var(--line)"/><line x1="0" x2="600" y1="${base}" y2="${base}" stroke="var(--line)"/>
    ${b.map(q=>`<path d="${q.d}" fill="var(--sun)"/>`).join("")}<line class="cross" y1="0" y2="${base}" stroke="var(--muted)" visibility="hidden"/></svg></div>
    <div class="xlabs">${single?`<span style="margin:auto">${esc(fmtDay(win.end,true))}</span>`:`<span>${esc(fmtDay(win.start))}</span><span>${esc(fmtDay(win.end))}</span>`}</div>`;
}
function render(){
  const P=D.platforms.map(p=>({...p,counts:p.counts.slice().sort((a,b)=>a.date.localeCompare(b.date))}));
  const dates=[...new Set(P.flatMap(p=>p.counts.map(c=>c.date)))].sort();
  const lastDate=dates[dates.length-1],end=dayNum(lastDate);
  // never start the axis before the first count, so a young history fills the chart
  const rangeStart=range?dayStr(end-range*864e5):dates[0];
  const win={start:rangeStart<dates[0]?dates[0]:rangeStart,end:lastDate};
  const lastOf=p=>p.counts[p.counts.length-1];
  const total=P.reduce((a,p)=>a+lastOf(p).n,0);
  const top=P.slice().sort((a,b)=>lastOf(b).n-lastOf(a).n)[0];
  const totalAt=d=>P.reduce((a,p)=>{const c=atOrBefore(p.counts,d);return a+(c?c.n:0)},0);
  const baseDate=dates[0]<lastDate?(dates[0]<=win.start?win.start:dates[0]):null;
  const change=baseDate?total-totalAt(baseDate):null;
  const old=isOld(D.checked);
  $("#dash").innerHTML=`
  <section class="card head">
    <div class="top"><img class="logo" src="logo.png" alt="Breaking Clouds logo"><h1>Breaking Clouds audience</h1>
      <div class="brands">${P.map(p=>`<a href="${esc(p.url)}" target="_blank" rel="noopener" aria-label="${esc(p.name)}" title="${esc(p.name)}">${ICONS[p.id]||""}</a>`).join("")}</div></div>
    <p class="narr">Breaking Clouds reaches <b>${fmtN(total)} followers and subscribers</b> across <b>${P.length} platforms</b>. <b>${esc(top.name)}</b> is the largest with <b>${fmtN(lastOf(top).n)}</b> (<b>${Math.round(lastOf(top).n/total*100)}%</b> of the total).${change!==null?` The total changed by <b>${signed(change)}</b> since ${esc(fmtDay(baseDate))}.`:""}</p>
    <div class="ctl"><div class="chips" role="group" aria-label="Time range">${RANGES.map(([d,l])=>`<button data-r="${d}" aria-pressed="${range===d}">${l}</button>`).join("")}</div>
      <span class="meta live ${old?"old":""}"><i></i>${old?"Not updated for ":"Checked "}${old?esc(ago(D.checked).replace(" ago","")):esc(ago(D.checked))}</span></div>
  </section>
  <section class="grid">
    <article class="card big"><div class="lab">Total audience</div><div class="num">${fmtN(total)}</div>
      <div class="subs"><div><b>${P.length}</b><span>platforms</span></div><div><b>${esc(top.name)}</b><span>largest audience</span></div><div><b>${change===null?"–":signed(change)}</b><span>${change===null?"change appears soon":"change in this period"}</span></div></div>
      ${bars(P,dates,win)}
      <p class="note">Followers and subscribers added together. Someone on two platforms counts twice.</p></article>
    ${P.map(p=>{const l=lastOf(p),b=atOrBefore(p.counts,win.start)||p.counts[0];
      const chg=b.date===l.date?`Since ${esc(fmtDay(l.date))}`:`<b>${signed(l.n-b.n)}</b> since ${esc(fmtDay(b.date))}`;
      return `<article class="card small"><div class="who">${ICONS[p.id]||""}<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a></div>
        <div class="num">${fmtN(l.n)}<span class="unit">${esc(l.n===1?p.metric.replace(/s$/,""):p.metric)}</span></div>
        <div class="chg">${chg}</div>
        ${Date.now()-Date.parse(p.lastRead)>(p.id==="instagram"?50:STALE_HOURS)*36e5?`<div class="stale">Last read ${esc(ago(p.lastRead))}</div>`:""}
        ${spark(p.counts,win,p.metric)}</article>`}).join("")}
    <article class="card small"><div class="lab">Updates</div><div class="num" style="font-size:24px">About hourly</div>
      <div class="chg">Numbers come from each public page, while the Breaking Clouds PC is on. Last checked ${esc(ago(D.checked))}.</div></article>
  </section>`;
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{range=Number(b.dataset.r);render()});
  document.querySelectorAll(".plot").forEach(wire);
}
function wire(plot){
  const pts=JSON.parse(plot.dataset.pts),vw=Number(plot.dataset.w),svg=plot.querySelector("svg"),cross=svg.querySelector(".cross");
  if(!pts.length)return;let tip=null;
  const hide=()=>{cross.setAttribute("visibility","hidden");if(tip){tip.remove();tip=null}};
  const move=e=>{const r=svg.getBoundingClientRect();if(!r.width)return;
    const vx=(e.clientX-r.left)/r.width*vw,p=pts.reduce((a,b)=>Math.abs(b.x-vx)<Math.abs(a.x-vx)?b:a);
    cross.setAttribute("x1",p.x);cross.setAttribute("x2",p.x);cross.setAttribute("visibility","visible");
    if(!tip){tip=document.createElement("div");tip.className="tip";plot.append(tip)}
    tip.textContent=p.label;const W=plot.offsetWidth;
    if(tip.offsetWidth>W){tip.style.whiteSpace="normal";tip.style.width=W+"px"}
    const half=Math.min(tip.offsetWidth/2,W/2),left=(r.left-plot.getBoundingClientRect().left)+p.x/vw*r.width;
    tip.style.left=Math.max(half,Math.min(W-half,left))+"px"};
  plot.addEventListener("pointermove",move);plot.addEventListener("pointerdown",move);
  plot.addEventListener("pointerleave",hide);plot.addEventListener("pointercancel",hide);
}
async function load(){
  try{
    const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;
    D=await r.json();render();
  }catch(e){if(!D)$("#dash").innerHTML=`<div class="card"><p class="narr">The numbers couldn't be loaded. Check your connection and reload this page.</p></div>`}
}
load();setInterval(load,5*60*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
</body>
</html>
